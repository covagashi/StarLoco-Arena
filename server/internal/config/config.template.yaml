# =============================================================================
#  DofusArena 2.70 server - configuration
# =============================================================================
#  This file was created automatically the first time the server ran, and it is
#  yours to edit. Restart the server after changing anything here.
#
#  Every available setting is listed below. Lines starting with "#" are turned
#  off and simply show you the value the server uses by default - delete the "#"
#  to take control of one.
#
#  Handbook: https://github.com/StarLoco/StarLoco-Arena
#  Need help: https://discord.com/invite/k3Yk9DuhgY
# =============================================================================


# -----------------------------------------------------------------------------
#  Game server - the port the DofusArena game client connects to.
# -----------------------------------------------------------------------------

# Where the game server listens, as "host:port".
#   0.0.0.0:5555     every network interface - friends on your network/internet
#                    can join (this is the default)
#   127.0.0.1:5555   this computer only - nobody else can connect
#
# Players joining from another computer must point their client at your machine:
# edit their client's game/config.properties and set
#   proxyAddresses_1=YOUR-IP:5555,YOUR-IP:5555
addr: "0.0.0.0:5555"


# -----------------------------------------------------------------------------
#  Web portal - the page where players create their own accounts.
# -----------------------------------------------------------------------------
web:
  # Serve the portal at all. With this off, create accounts yourself using the
  # command line instead (see the handbook).
  enabled: true

  # Where the portal listens, as "host:port".
  #
  # Port 0 means "choose one for me": the server tries 80 (the normal web port,
  # so players can just type your address with no ":port" suffix), then 8080,
  # 8090, 3000 and 5000, and finally any free port. Ports below 1024 usually
  # need administrator/root rights, which is why it falls back automatically.
  #
  # Set an explicit port to pin it, e.g. "0.0.0.0:8080".
  addr: "0.0.0.0:0"

  # Let visitors sign themselves up. Turn this off once everyone has registered
  # and the portal becomes read-only.
  registration_enabled: true

  # Optional link shown on the portal for players who still need the DofusArena
  # 2.70 client itself. It is EMPTY by default and that is deliberate: this
  # project distributes a server, not the game. The client is Ankama's
  # copyrighted work and is never bundled, committed or linked by default (see
  # DISCLAIMER.md).
  #
  # Only set this if you have a lawful copy you are entitled to share. Whatever
  # you put here is published on YOUR portal under YOUR name, so it is your
  # call to make, not one inherited from the software.
  client_download_url: ""

  # A directory of files that override the portal's built-in assets, so you can
  # brand the site without rebuilding the binary or forking the repository.
  #
  # Any path under /static/ is looked up here FIRST and falls back to the embedded
  # copy: dropping in logo.png, favicon.ico, arena-bg.jpg or even app.css replaces
  # just that file. Contents are hashed into the asset version, so a changed logo
  # busts the browser cache like any other asset.
  #
  # This is what makes the published project white-label - what ships in git
  # carries no operator's identity, no logo and no game artwork.
  # brand_dir: ""

  # The address players should type into their game client, shown on the portal
  # page. Leave empty to show the address the visitor is already using.
  # public_host: ""

  # Smallest allowed account name / password length for new sign-ups.
  # min_login_length: 3
  # min_password_length: 6

  # The name of your server, shown as the title on the website. Leave it out to
  # use "Arena Reborn".
  #
  # Do not name it "DofusArena": that is Ankama's trademark. Describing what
  # the server runs is fine - the site already does that - but taking the mark
  # as your site's own identity is what turns a preservation project into a
  # trademark problem.
  # server_name: "My Arena Server"

  # Published on /legal and /privacy as the address a rights holder writes to
  # for a takedown, and a player writes to for a GDPR request.
  #
  # SET THIS IF YOUR SERVER IS PUBLIC. A takedown page nobody can write to is
  # not a takedown process, and data-protection law requires a controller to be
  # reachable. Empty renders an explanatory line instead of a broken link.
  # contact_email: "you@example.com"

  # A folder holding your own branding, which replaces the built-in assets
  # without rebuilding the binary or forking the project.
  #
  # What ships here is deliberately WHITE-LABEL: no logo, no favicon, no game
  # artwork, and the server name renders as plain text. That keeps the public
  # project free of any one operator's identity (and of artwork nobody here
  # owns). Your deployment supplies its own.
  #
  # Any file you drop in shadows the built-in one of the same name:
  #   logo.png            header and footer wordmark
  #   logo-large.png      large mark on the landing page (+ logo-large-2x.png)
  #   favicon.ico         browser tab icon (+ favicon-32.png, favicon-192.png)
  #   apple-touch-icon.png
  #   arena-bg.jpg/.webp  landing-page backdrop (+ -sm and -xl variants)
  #   fighter-1.webp      decorative figures (+ -2x, and fighter-2*)
  #   app.css             the whole stylesheet, if you want to restyle
  #
  # Relative paths resolve against the working directory, like the database.
  # brand_dir: "branding"

  # The company hosting this server, shown in the legal notice.
  #
  # SET THIS IF YOUR SERVER IS PUBLIC, and give the legal entity plus its
  # address. Under French law (LCEN art. 6 III-2) an operator publishing in a
  # non-professional capacity may keep their own name off the site ONLY if the
  # host is named and holds their identity; most of the EU has an equivalent
  # rule. Leaving this empty does not make you anonymous, it makes the legal
  # notice incomplete.
  # hosting_provider: "IONOS SE, Elgendorfer Strasse 57, 56410 Montabaur, Germany"

  # Keeps players logged in to the website across server restarts.
  #
  # Leave this empty and the server makes up a new random key every time it
  # starts, which works fine but signs everyone out whenever you restart. Set it
  # to a long random string (40+ characters) to avoid that. Treat it like a
  # password: anyone who knows it can forge a login for any account, so do not
  # share it or commit it anywhere public. You can also supply it out-of-band
  # with the ARENA_WEB_SESSION_SECRET environment variable instead of writing it
  # here.
  # session_secret: ""

  # Turn this on ONLY when the website is served over https, e.g. behind a
  # reverse proxy with a certificate. It tells browsers to send the login cookie
  # over encrypted connections only. Switching it on for a plain http:// server
  # makes logging in impossible - the browser will quietly refuse to send the
  # cookie back - so it stays off by default.
  # Mark session cookies "Secure" so browsers never send them over plain HTTP,
  # and emit Strict-Transport-Security.
  #
  # Leave false when the portal is served over http:// - a Secure cookie is not
  # sent to localhost at all, so signing in would silently fail. Set it TRUE the
  # moment you put the portal behind HTTPS: without it a single plain-HTTP request
  # leaks the session cookie, and it is the one setting whose wrong value is
  # invisible until someone exploits it. The server warns at startup if the portal
  # is enabled and this is false.
  # secure_cookies: false

  # Reverse-proxy support. When the website sits behind nginx/Caddy/Cloudflare,
  # every request arrives from the proxy, so the sign-up and sign-in rate limits
  # - which are per visitor address - collapse into ONE shared bucket and the
  # whole server gets locked out after a handful of registrations.
  #
  # List the addresses of the proxies you run, as IPs or CIDRs. Only a request
  # arriving FROM one of these is allowed to claim a different address via its
  # X-Forwarded-For header. Leave it empty (the default) when the portal is
  # reachable directly, because then anyone could forge that header and dodge
  # the limit entirely.
  #
  # Typical value when nginx runs on this same machine:
  #   trusted_proxies: ["127.0.0.1", "::1"]
  # trusted_proxies: []

  # The website speaks the same four languages as the game client: en, fr, es,
  # de. Visitors get whichever their browser asks for, and can switch by hand
  # from the footer - this only decides what a browser with no usable
  # preference sees. Empty means English.
  # default_language: "en"

  # Where /discord sends people. The game client's login screen has a
  # "Rejoindre le Discord" button pointing at this site, so you can set or
  # change the invite here without re-issuing the client to your players.
  # Leave it empty and /discord simply sends them to the home page.
  # discord_url: "https://discord.gg/xxxxxxx"

  # The game client has a built-in bug reporter (the "Rapport de bug" dialog,
  # or the /bugreport console command). It sends the report - with a screenshot,
  # the client log and where the player was standing - to whatever address is in
  # the client's own bugReportURL setting. Point that at this website and the
  # reports show up under Admin -> Bug reports.
  #
  # In the client's game/config.properties:
  #   bugReportURL=https://your-site.example/
  # (the client appends the language and "/bug-report" itself)
  # bug_reports_enabled: true

  # Where submitted screenshots are written. Relative paths are resolved next to
  # the server, like the database file. They are kept out of the database on
  # purpose: they are full-size JPEGs, and anything in the database ends up in
  # every backup. Set to "" to record reports without keeping screenshots.
  # bug_report_dir: "bugreports"

  # The game client is from 2012 and bundles Java 1.6, which cannot speak modern
  # TLS at all - so if your website is https-only (behind Cloudflare, nginx, a
  # CDN...), the in-game bug dialog simply cannot reach it. It fails silently:
  # the client tells the player "sent" before it even opens the connection.
  #
  # Setting this starts a SECOND, plain-http listener that serves ONLY the
  # bug-report endpoint - the website, its login form and the admin console are
  # NOT reachable on it. Then point the client's bugReportURL at that address:
  #   bug_report_addr: "0.0.0.0:80"
  #   (client) bugReportURL=http://your-server-address/
  #
  # Bug text and screenshots travel unencrypted on this port. Leave it empty if
  # your site is plain http anyway (then the normal port already works), or if
  # you would rather not accept in-game reports at all.
  # bug_report_addr: ""

  # Forward every accepted bug report to a Discord-compatible webhook. The POST
  # body is the standard webhook JSON ({content, embeds[]}), so Discord,
  # Slack-compatible bridges and most "incoming webhook" bots all accept it.
  # The report is stored locally first; a webhook failure is only logged.
  # Treat the URL like a password - anyone holding it can post to the channel;
  # prefer the ARENA_WEB_BUG_REPORT_WEBHOOK env var over writing it here.
  # bug_report_webhook: ""

  # The portal's address AS PLAYERS REACH IT - e.g.
  # "https://arena.example.com" or "http://203.0.113.7:8080". The Godot client
  # asks the game socket for it (opcode 60001) so its built-in bug reporter
  # knows where to POST; it cannot derive an http URL from a TCP connection.
  # Empty announces the locally-bound listener (right for same-host play).
  # public_url: ""


# -----------------------------------------------------------------------------
#  Game data - the card, spell and map files copied out of the game client.
# -----------------------------------------------------------------------------

# Where your DofusArena game data lives.
#
# A small set of this data (cards, spells, arenas - no art, audio, or code)
# ships bundled with the server, so fights already work with no change here.
#
# Only set this if you want to use your own client's data instead - e.g. after
# a client update changes card numbers. The simplest answer is the folder that
# holds DofusArena.exe - the server understands the client's own layout and
# finds the cards, spells and arenas inside it. Its game and game/contents
# folders work too, as does a folder you have copied data.bdat, indexes.bdat
# and maps/ into.
#
#   data_dir: "C:/Program Files (x86)/Ankama/DofusArena"
#
# Leave it as "data" to use the bundled copy (or a data folder you place next
# to the server yourself). Relative paths are resolved from wherever the
# server is started.
data_dir: "data"


# -----------------------------------------------------------------------------
#  Updates
# -----------------------------------------------------------------------------
update_check:
  # Ask GitHub once at startup whether a newer server release exists, and print
  # a short notice if so. Nothing is ever downloaded or installed for you, and
  # nothing about your server or your players is sent - it is a plain HTTPS GET
  # of a public page. Set to false to switch it off completely.
  enabled: true

  # How long to wait for GitHub before giving up, in seconds. The check runs in
  # the background and never holds up startup.
  # timeout_seconds: 5


# -----------------------------------------------------------------------------
#  Database - where accounts, coaches, fighters and teams are stored.
# -----------------------------------------------------------------------------
db:
  # sqlite | postgres | mysql
  # sqlite needs no setup at all: the file below is created on first run and is
  # the right choice unless you are running a large public server.
  driver: "sqlite"

  # sqlite:   path to the database file, created automatically.
  # postgres: "host=localhost user=arena password=secret dbname=arena port=5432 sslmode=disable"
  # mysql:    "arena:secret@tcp(localhost:3306)/arena?charset=utf8mb4&parseTime=True&loc=Local"
  dsn: "arena.db"

  # Database connection pool. sqlite allows a single writer so it stays at 1;
  # raise both for postgres/mysql on a busy server.
  max_open_conns: 1
  max_idle_conns: 1


# -----------------------------------------------------------------------------
#  World
# -----------------------------------------------------------------------------
world:
  # How far, in cells, overworld events (chat, movement, other players
  # appearing) travel. Keeps a crowded map from sending everything to everyone.
  # 0 means no limit - every event reaches every player.
  aoi_radius: 75

  # Matchmaking fairness. Two coaches are paired only if their ladder strength
  # is within "match_band" of each other. The band WIDENS by
  # "match_band_growth" for every second a player has been waiting, so a quiet
  # server still finds fights instead of leaving someone queued forever.
  #
  # With the defaults below, two coaches 1500 points apart are matched after
  # about 8 seconds of waiting.
  #
  # Set match_band to 0 to turn the check off and pair anyone with anyone -
  # usually what you want on a small private server.
  match_band: 300
  match_band_growth: 150


# -----------------------------------------------------------------------------
#  Logging & diagnostics
# -----------------------------------------------------------------------------

# How much detail to print: error | warn | info | debug.
# "info" keeps the console quiet; "debug" is very noisy and meant for
# development or for chasing a specific problem.
log_level: "info"

# DEVELOPMENT ONLY - a local HTTP endpoint for injecting packets into a running
# server. Leave this off unless you are working on the server itself; it grants
# full control to anything that can reach it.
# debug_addr: "127.0.0.1:5599"

# ---------------------------------------------------------------------------
# rules - the numbers this server INVENTED
#
# The 2.70 client receives every one of these already computed, so it cannot
# arbitrate them: there is no retail-correct value to recover, only a value we
# chose. They are exposed here so you can tune your server without patching Go,
# and so they are never mistaken for protocol facts.
#
# Leave a value at 0 (or omit it) to use the built-in default shown below.
# ---------------------------------------------------------------------------
rules:
  # XP a fight awards before morale and card-set bonuses.
  base_xp_per_fight: 100
  # Evolution-standing awarded for a ranked win / loss. The client renders a
  # level derived from total standing, never the per-fight delta.
  standing_win: 10
  standing_loss: 3
  # Cap on the friend list and the ignore list. The client carries the refusal
  # message but no limit of its own, so this is enforced server-side.
  max_social_list_entries: 100

# ---------------------------------------------------------------------------
# limits: what one client, or one machine, can cost the server.
#
# These exist because none of it was bounded: the accept loop took every
# connection unconditionally, nothing evicted a socket that connected and never
# spoke, and login (which costs a bcrypt hash on the session goroutine) had no
# throttle at all. A few dozen sockets spamming logins could saturate every core.
#
# Convention for every numeric field below: omit or 0 = use the default shown,
# a negative value = disable that limit entirely.
# ---------------------------------------------------------------------------
limits:
  # Concurrent game sockets server-wide.
  max_connections: 2000

  # Concurrent sockets from a single address. Generous enough for a household or
  # a shared NAT, tight enough that one machine cannot exhaust the global cap.
  max_connections_per_ip: 8

  # How long a socket may stay connected WITHOUT authenticating. This is what
  # evicts a connect-and-say-nothing flood.
  handshake_timeout_seconds: 30

  # Drop a session that sends nothing at all for this long. The retail client
  # pings well inside this, so it only ever catches dead sockets.
  idle_timeout_seconds: 300

  # Authentication attempts per minute, per address. Each attempt costs a bcrypt
  # hash, so this bounds both CPU exhaustion and password guessing. Raise it if
  # many legitimate players share one NAT.
  login_attempts_per_minute: 10

  # Create an account for any unknown login presented on the GAME socket.
  #
  # Convenient for development, a liability in production: it lets anyone mint
  # unlimited accounts, each costing a bcrypt hash and a database row, and it is
  # NOT covered by web.registration_enabled. Set false on a public instance and
  # register players through the portal or cmd/seedaccount.
  auto_register: true

  # Grant admin to the first account created on an empty database.
  #
  # Convenient locally; on a fresh public instance it is a race an attacker can
  # win simply by connecting before you do, and every GM command is gated on that
  # one flag. Set false and seed your admin with cmd/seedaccount.
  first_account_is_admin: true
