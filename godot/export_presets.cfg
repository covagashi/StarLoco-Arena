; Export presets for the Pippop Arena Godot client.
;
; One build only: the web client, published on itch.io (S51). There are no
; desktop builds.
;
; The assets/ tree (ui/, i18n/, audio/, content/) and art/ are deliberately
; EXCLUDED from the .pck: they are read raw, not as Godot resources.
; tools/web/pack_web.gd writes them beside index.html as bundles the client
; downloads when it needs them (src/util/web_assets.gd):
;   godot --headless --path godot --export-release Web ../dist/web/index.html
;   godot --headless --path godot -s tools/web/pack_web.gd -- ../dist/web
;
; tools/ and test/ are excluded too — a player ships no test harness.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="assets/*, test/*, tools/*"
export_path="../dist/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false
