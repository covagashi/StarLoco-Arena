; Export presets for the StarLoco Arena Godot client.
;
; The assets/ tree is deliberately EXCLUDED from the .pck and shipped as a
; loose folder beside the executable, mirroring how the server ships
; data-dist/. src/util/asset_paths.gd probes that folder as its second root
; (B-173), so a release reads its raw JSON, anim frames, fonts and atlases
; from disk exactly as the editor does. Packing them instead would not work:
; they are not Godot resources, and res:// inside a .pck has no loose files.
;
; tools/ and test/ are excluded too — a player ships no test harness.

[preset.0]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="assets/*, test/*, tools/*, deprecated_hall/*"
export_path="../dist/macos/ArenaClient.app"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/architecture="universal"
codesign/codesign=1
application/bundle_identifier="org.starloco.arena.client"
application/short_version="0.1.0"
application/version="0.1.0"
application/copyright="Fan project. Not affiliated with Ankama."
