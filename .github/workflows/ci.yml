name: CI

on:
  push:
    # main-covaga is where the work actually happens: it ran 130 commits ahead
    # of v2.70 without CI ever firing once, which is how an export-breaking
    # asset-path bug class (B-173) reached 20 files unnoticed.
    branches: [v2.70, main-covaga]
  pull_request:
    branches: [v2.70, main-covaga]
  workflow_dispatch:

# Only the latest run of a branch/PR matters; cancel superseded ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: server
        shell: bash # available on the Windows runners too, so one script fits both

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # Single source of truth: the toolchain version lives in go.mod.
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./test)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        if: runner.os == 'Linux'
        run: |
          cp go.mod go.mod.bak && cp go.sum go.sum.bak
          go mod tidy
          if ! diff -q go.mod go.mod.bak >/dev/null || ! diff -q go.sum go.sum.bak >/dev/null; then
            echo "::error::go.mod/go.sum are not tidy - run 'go mod tidy' in server/ and commit the result"
            diff go.mod.bak go.mod || true
            exit 1
          fi
          rm go.mod.bak go.sum.bak

      # Dependency and toolchain CVEs are the one security class that decays on
      # its own: the code does not change, the advisory database does. Two real
      # findings were only noticed because someone happened to run this by hand
      # (pgx v5.6.0, and seven reachable stdlib issues on Go 1.26.4), so it is a
      # gate now rather than a habit.
      #
      # Linux only - it is a property of go.mod and the toolchain, identical on
      # both runners, so running it twice buys nothing.
      - name: Vulnerability scan
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # Fails the build when a vulnerability is REACHABLE from this code.
          # Advisories in modules we merely require, but never call, do not fail:
          # that is govulncheck's own default and it is the right line - a gate
          # that cries wolf gets disabled.
          govulncheck ./...

      # cmd/studio is a Wails desktop app: it needs CGO plus GTK/WebKit headers
      # that are not on a stock Linux runner, and it is not part of a release.
      # Windows is the platform it is developed on, so it is fully covered
      # there; Linux covers everything that actually ships.
      - name: Build, vet and test (Linux, excluding the desktop Studio tool)
        if: runner.os == 'Linux'
        run: |
          # `go build ./...` silently skips packages that contain only _test.go
          # files, but naming packages explicitly (which is how studio is
          # excluded) makes the same case a hard error. test/e2e is exactly
          # that, so the build list is filtered on .GoFiles - non-empty only
          # for packages with buildable non-test sources.
          build_pkgs=$(go list -f '{{if .GoFiles}}{{.ImportPath}}{{end}}' ./... | grep -v '/cmd/studio')
          all_pkgs=$(go list ./... | grep -v '/cmd/studio')
          go build $build_pkgs
          go vet $all_pkgs
          # -timeout 25m, not the 10m default: the e2e suite drives real fights over real
          # sockets and every package runs concurrently here, so on a 2-core runner it
          # lands close enough to 10m that variance alone fails a release (B-129).
          go test -timeout 25m $all_pkgs

      - name: Build, vet and test (Windows, everything)
        if: runner.os == 'Windows'
        run: |
          go build ./...
          go vet ./...
          go test -timeout 25m ./...

      # The thing users actually download must compile for every release target
      # on every commit - a cross-compilation break should never be discovered
      # at release time.
      - name: Cross-compile the release binary for all targets
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            export GOOS=${target%/*} GOARCH=${target#*/}
            echo "building $GOOS/$GOARCH"
            go build -trimpath -o /dev/null ./cmd/server
          done

  godot:
    name: Godot client (headless unit lane)
    runs-on: ubuntu-latest
    env:
      # Pinned deliberately: the client is developed against this exact build
      # and a GDScript parse regression across a minor bump would look like a
      # code failure. Bump this on purpose, never implicitly.
      GODOT_VERSION: "4.7.1"
    defaults:
      run:
        working-directory: godot

    steps:
      - uses: actions/checkout@v5

      - name: Install Godot ${{ env.GODOT_VERSION }}
        working-directory: .
        run: |
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSLo /tmp/godot.zip "$url"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      # A fresh checkout has no .godot/, and `--quit` does NOT build it:
      # verified on an asset-free copy of this tree, where the unit lane then
      # died with 'Identifier "AssetPaths" not declared in the current scope'
      # because .godot/global_script_class_cache.cfg had never been written,
      # so every `class_name` in src/ was unknown. `--import` writes it. The
      # pass doubles as a parse check of every GDScript in the project, which
      # is the cheapest real gate we have on the client.
      - name: Import pass (builds the global class cache; parse-checks every script)
        run: godot --headless --path . --import

      # ONLY the asset-free lane. godot/assets/ is git-ignored on purpose
      # (AGENTS.md: no Ankama bytes in the repo), so the visual previews need
      # coach_7000 plus the appSkin atlases and can never run on a runner.
      # `run_tests.sh --visual` is the local pre-push ritual instead; the two
      # lanes and why they are split are documented in sprints/S01.
      - name: Lint + unit lane
        env:
          GODOT: /usr/local/bin/godot
        run: ./run_tests.sh --headless
